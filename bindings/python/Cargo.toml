[package]
name = "fast-umap-python"
version = "1.6.0"
edition = "2021"
publish = false

[lib]
name = "_fast_umap"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
numpy = "0.29.0"
fast-umap = { path = "../.." }
# The library owns training; Burn's high-level `train` feature is unnecessary.
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "autodiff", "autotune", "optim", "extension", "store", "flex", "wgpu"] }
crossbeam-channel = "0.5.17"
