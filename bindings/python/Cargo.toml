[package]
name = "fast-umap-python"
version = "1.6.0"
edition = "2024"
publish = false

[lib]
name = "_fast_umap"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
numpy = "0.29.0"
fast-umap = { path = "../.." }
# The library owns training; Burn's high-level `train` feature is unnecessary.

crossbeam-channel = "0.5.17"

[features]
parametric = ["fast-umap/parametric"]
tracing = ["fast-umap/tracing"]