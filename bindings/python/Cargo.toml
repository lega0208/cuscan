[package]
name = "fast-umap-python"
version = "1.6.0"
edition = "2021"
publish = false

[lib]
name = "_fast_umap"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
numpy = "0.29"
fast-umap = { path = "../.." }
# Do not enable burn's `train` feature: it pulls burn-train, which enables
# burn-ndarray's default `multi-threads` and breaks bit-identical CPU fits.
burn = { version = "0.20.1", default-features = false, features = ["std", "autodiff", "autotune", "ndarray", "wgpu"] }
cubecl = { version = "0.9.0", features = ["wgpu"] }
crossbeam-channel = "0.5.15"
num = "0.4.3"
