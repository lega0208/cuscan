[package]
name = "fast-umap"
version = "1.6.0"
description = "Configurable UMAP (Uniform Manifold Approximation and Projection) in Rust"
keywords = ["UMAP", "dimensionality", "manifold", "machine-learning", "GPU"]
categories = ["science", "mathematics", "visualization"]
authors = ["Eugene Hauptmann"]
repository = "https://github.com/eugenehp/fast-map"
homepage = "https://github.com/eugenehp/fast-map"
documentation = "https://docs.rs/fast-umap/latest/fast_umap/"
license = "MIT"
edition = "2024"
exclude = ["figures/*", "references/"]

[workspace]
members = [".", "bindings/python"]
default-members = ["."]
exclude = ["references"]
resolver = "2"

# docs.rs build configuration.
# CPU builds require a native LLVM bundle; docs.rs must not fetch/link that
# network-dependent runtime. This documentation build uses CUDA instead.
# `rustdoc-args`         — pass --cfg docsrs so that doc-only items gated with
#                          #[cfg(docsrs)] (e.g. nightly doc_cfg annotations)
#                          are included in the rendered output.
[package.metadata.docs.rs]
no-default-features = true
features = ["cuda", "parametric", "pca", "nn-descent"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
burn = { version = "0.22.0", default-features = false, features = [
  "std",
  "autotune",
  "autodiff",
  "extension",
  "linalg",
  "store",
] }
# Enable CubeCL with a concrete CPU or GPU runtime.
burn-cubecl = { version = "0.22.0", default-features = false, optional = true }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
cubecl = { version = "0.11.0", default-features = false, optional = true }
cudarc = { version = "0.19.10", features = [
  "std",
  "driver",
  "nvrtc",
  "dynamic-loading",
  "cuda-version-from-build-system",
  "fallback-latest",
], default-features = false, optional = true }
faer = { version = "=0.24.4", features = ["npy", "perf-warn", "nightly"] }
hsl = { version = "0.1.1", optional = true }
indicatif = "0.18.6"
ndarray = "0.17.2"
num = "0.4.3"
num-traits = "0.2.19"
plotters = { version = "0.3.7", optional = true }
prettytable = "0.10.0"
rand = "0.10.3"
rayon = "1.12.0"
serde = "1.0.229"
tracing = { version = "0.1", optional = true }
umap-rs = { version = "0.4.5", optional = true }

[dev-dependencies]
burn = { version = "0.22.0", default-features = false, features = [
  "std",
  "extension",
  "store",
] }
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
mnist = { version = "0.6.0", git = "https://github.com/eugenehp/mnist.git", features = [
  "download",
] }
serde_json = "1.0.151"
chrono = "0.4.45"
zip = "=0.6.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
cubecl-environment = { version = "=0.11.0", default-features = false, features = [
  "std",
  "persistence",
] }
cubecl-server = { version = "=0.11.0", default-features = false, features = [
  "std",
  "persistence",
] }
ciborium = "0.2.2"
log = "0.4"

[features]
default = ["cuda", "cpu", "verbose"]
# Core backend features
gpu = [
  "dep:burn-cubecl",
  "dep:cubecl",
  "burn/cubecl",
  "burn/wgpu",
  "burn/fusion",
] # GPU backend with WGPU support
# CUDA requires an NVIDIA runtime; CPU remains independently selectable.
cuda = [
  "dep:burn-cubecl",
  "dep:cubecl",
  "burn/cubecl",
  "burn/cuda",
  "burn/fusion",
  "dep:cudarc",
] # NVIDIA CUDA backend
cpu = [
  "dep:burn-cubecl",
  "dep:cubecl",
  "burn/cubecl",
  "burn/cpu",
  "burn/fusion",
] # CubeCL LLVM CPU runtime

tracing = ["dep:tracing", "burn/tracing", "cubecl?/tracing"]

parametric = ["burn/optim"] # Parametric UMAP support

# Optional features
pca = []                               # PCA warm-start for initial embedding
nn-descent = []                        # Approximate KNN via NN-Descent for large datasets
verbose = []                           # Verbose output and progress bars
plotters = ["dep:plotters", "dep:hsl"] # Plotting support


# Crate comparison
umap-rs = ["dep:umap-rs"]

[[bench]]
name = "umap_bench"
required-features = ["parametric"]
harness = false

[[bench]]
name = "standard_umap_cpu"
required-features = ["cpu"]
harness = false

[[bench]]
name = "standard_umap_cuda"
required-features = ["cuda"]
harness = false

[[example]]
name = "serialization_demo"
required-features = ["gpu"]

[[example]]
name = "benchmark_serialization"
required-features = ["gpu"]

[[example]]
name = "benchmark_scalability"
required-features = ["gpu"]

[[example]]
name = "bench_mnist"
