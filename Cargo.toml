[[example]]
name = "mnist_benchmark"
required-features = ["gpu", "plotters"]

[[example]]
name = "crate_comparison"
required-features = ["umap-rs", "plotters"]

[[example]]
name = "advanced"
required-features = ["gpu"]

[[example]]
name = "backend_choice"
required-features = ["parametric"]

[[example]]
name = "cpu_training_demo"
required-features = ["parametric"]

[[example]]
name = "simple"
required-features = ["gpu"]

[[example]]
name = "mnist"
required-features = ["gpu", "plotters"]

[[example]]
name = "fallback_demo"
required-features = ["gpu", "cpu"]

[[example]]
name = "backend_benchmark"
required-features = ["parametric"]

[[example]]
name = "pca_comparison"
required-features = ["pca"]

[[example]]
name = "large_scale"
required-features = ["nn-descent"]

[[example]]
name = "cuda"
required-features = ["cuda", "parametric"]

[[example]]
name = "profile_standard_cuda"
