[package]
name = "fast-umap"
version = "1.6.0"
description = "Configurable UMAP (Uniform Manifold Approximation and Projection) in Rust"
keywords = ["UMAP", "dimensionality", "manifold", "machine-learning", "GPU"]
categories = ["science", "mathematics", "visualization"]
authors = ["Eugene Hauptmann"]
repository = "https://github.com/eugenehp/fast-map"
homepage = "https://github.com/eugenehp/fast-map"
documentation = "https://docs.rs/fast-umap/latest/fast_umap/"
license = "MIT"
edition = "2021"

# docs.rs build configuration.
# `all-features = true`  — build docs with every feature enabled so nothing
#                          is hidden behind a flag.
# `rustdoc-args`         — pass --cfg docsrs so that doc-only items gated with
#                          #[cfg(docsrs)] (e.g. nightly doc_cfg annotations)
#                          are included in the rendered output.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

exclude = ["figures/*"]

[dependencies]
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "autodiff", "autotune", "optim", "extension", "store", "flex"] }
burn-cubecl = { version = "=0.22.0-pre.4", optional = true }
crossbeam-channel = "0.5.17"
ctrlc = "3.5.2"
cubecl = { version = "=0.11.0-pre.4", optional = true }
cudarc = { version = "0.19.10", features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-version-from-build-system", "fallback-latest"], default-features = false, optional = true }
hsl = { version = "0.1.1", optional = true }
indicatif = "0.18.6"
ndarray = "0.17.2"
num = "0.4.3"
num-traits = "0.2.19"
plotters = { version = "0.3.7", optional = true }
prettytable = "0.10.0"
umap-rs = { version = "0.4.5", optional = true }
rand = "0.10.3"
rayon = "1.12.0"
serde = "1.0.229"

[dev-dependencies]
burn = { version = "=0.22.0-pre.4", default-features = false, features = ["std", "autodiff", "optim", "extension", "store", "flex"] }
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
mnist = { version = "0.6.0", git = "https://github.com/eugenehp/mnist.git", features = ["download"] }
umap-rs = "0.4.5"
serde_json = "1.0.151"
chrono = "0.4.45"

[[bench]]
name = "umap_bench"
harness = false

[[example]]
name = "serialization_demo"
required-features = ["gpu"]

[[example]]
name = "benchmark_serialization"
required-features = ["gpu"]

[[example]]
name = "benchmark_scalability"
required-features = ["gpu"]

[[example]]
name = "bench_mnist"
required-features = ["gpu", "plotters"]

[[example]]
name = "mnist_benchmark"
required-features = ["gpu", "plotters"]

[[example]]
name = "crate_comparison"
required-features = ["plotters"]

[[example]]
name = "advanced"
required-features = ["gpu"]

[[example]]
name = "backend_choice"

[[example]]
name = "simple"
required-features = ["gpu"]

[[example]]
name = "mnist"
required-features = ["gpu", "plotters"]

[[example]]
name = "fallback_demo"
required-features = ["gpu", "cpu"]

[[example]]
name = "backend_benchmark"

[[example]]
name = "pca_comparison"
required-features = ["pca"]

[[example]]
name = "large_scale"
required-features = ["nn-descent"]

[[example]]
name = "cuda"
required-features = ["cuda"]

[[bin]]
name = "bench_report"
required-features = ["gpu"]

[features]
default = ["cuda", "verbose"]
# Core backend features
gpu = ["burn/wgpu", "burn/fusion", "dep:burn-cubecl", "dep:cubecl", "cubecl/wgpu"]  # GPU backend with WGPU support
# CUDA is intentionally excluded from `all` and the default features because it requires a CUDA toolkit.
cuda = ["burn/cuda", "burn/fusion", "dep:burn-cubecl", "dep:cubecl", "cubecl/cuda", "dep:cudarc"]  # NVIDIA CUDA backend
cpu = ["dep:umap-rs"]  # CPU backend with umap-rs fallback
# Optional features
pca = []  # PCA warm-start for initial embedding
nn-descent = []  # Approximate KNN via NN-Descent for large datasets
verbose = []  # Verbose output and progress bars
plotters = ["dep:plotters", "dep:hsl"]  # Plotting support
# Combined features for convenience
all = ["gpu", "cpu", "pca", "nn-descent", "verbose", "plotters"]

[workspace]
members = [".", "bindings/python"]
default-members = ["."]
resolver = "2"
