[workspace]
resolver = "3"
members = ["crates/fast-umap-core", "crates/fast-umap", "crates/fast-umap-python", "crates/fast-cubecl-common", "crates/fast-hdbscan-core", "crates/fast-hdbscan"]
default-members = ["crates/fast-umap"]
exclude = ["references"]

[workspace.package]
version = "1.6.0"
publish = false
edition = "2024"
license = "MIT"
authors = ["Eugene Hauptmann"]
repository = "https://github.com/eugenehp/fast-map"
homepage = "https://github.com/eugenehp/fast-map"

[workspace.dependencies]
fast-umap-core = { path = "crates/fast-umap-core", default-features = false }
fast-cubecl-common = { path = "crates/fast-cubecl-common", default-features = false }
fast-hdbscan-core = { path = "crates/fast-hdbscan-core", default-features = false }
fast-hdbscan = { path = "crates/fast-hdbscan", default-features = false }
fast-umap = { path = "crates/fast-umap", default-features = false }
burn = { version = "0.22.0", default-features = false, features = [
  "std",
  "autotune",
  "extension",
] }
burn-cubecl = { version = "0.22.0", default-features = false }
cubecl = { version = "0.11.0", default-features = false }
cubecl-cpu = { version = "0.11.0", default-features = false }
cudarc = { version = "0.19.10", features = [
  "std",
  "driver",
  "nvrtc",
  "dynamic-loading",
  "cuda-version-from-build-system",
  "fallback-latest",
], default-features = false }
faer = { version = "=0.24.4", features = ["npy", "perf-warn", "nightly"] }
rand = "0.10.3"
rayon = "1.12.0"
tracing = "0.1"
pyo3 = { version = "0.29.3", features = ["abi3-py310"] }
numpy = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
zip = "=0.6.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
cubecl-environment = { version = "=0.11.0", default-features = false, features = [
  "std",
  "persistence",
] }
cubecl-server = { version = "=0.11.0", default-features = false, features = [
  "std",
  "persistence",
] }
ciborium = "0.2.2"
log = "0.4"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
