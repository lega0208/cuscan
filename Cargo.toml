[workspace]
resolver = "3"
members = [
  "crates/umap-core",
  "crates/umap",
  "crates/cuscan-python",
  "crates/cuscan-common",
  "crates/hdbscan-core",
  "crates/hdbscan",
]
default-members = ["crates/umap"]
exclude = ["references"]

[workspace.package]
version = "0.1.0"
publish = false
edition = "2024"
license = "MIT"
repository = "https://github.com/lega0208/cuscan"

[workspace.dependencies]
umap-core = { path = "crates/umap-core", default-features = false }
cuscan-common = { path = "crates/cuscan-common", default-features = false }
hdbscan-core = { path = "crates/hdbscan-core", default-features = false }
hdbscan = { path = "crates/hdbscan", default-features = false }
umap = { path = "crates/umap", default-features = false }
burn = { version = "0.22.1", default-features = false, features = [
  "std",
  "autotune",
  "extension",
  "persistence",
  "cubecl",
  "cpu",
  "cuda",
  "fusion",
] }
burn-cubecl = { version = "0.22.1", default-features = false, features = ["cpu", "cuda"] }
cubecl = { version = "0.11.1", default-features = false, features = ["cpu", "cuda", "persistence"] }
cubecl-cpu = { version = "0.11.1", default-features = false }
cudarc = { version = "0.19.10", features = [
  "std",
  "driver",
  "nvrtc",
  "dynamic-loading",
  "cuda-version-from-build-system",
  "fallback-latest",
], default-features = false }
faer = { version = "=0.24.4", features = ["npy", "perf-warn", "nightly"] }
rand = "0.10.3"
rayon = "1.12.0"
tracing = "0.1"
pyo3 = { version = "0.29.3", features = ["abi3-py312"] }
numpy = "0.29.0"
serde = "1.0.229"
serde_json = "1.0.151"
tempfile = "3.27.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-chrome = "0.7"
cubecl-environment = { version = "=0.11.3", default-features = false, features = [
  "std",
  "persistence",
] }
cubecl-server = { version = "=0.11.3", default-features = false, features = [
  "std",
  "persistence",
] }
ciborium = "0.2.2"
log = "0.4"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
