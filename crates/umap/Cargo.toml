[package]
name = "umap"
description = "Configurable UMAP (Uniform Manifold Approximation and Projection) in Rust"
keywords = ["UMAP", "dimensionality", "manifold", "machine-learning", "GPU"]
categories = ["science", "mathematics", "visualization"]
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
umap-core = { workspace = true }
cuscan-common = { workspace = true }
burn = { workspace = true }
burn-cubecl = { workspace = true }
cubecl = { workspace = true }
cubecl-cpu = { workspace = true, optional = true }
rand = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-chrome = { workspace = true }
cubecl-environment = { workspace = true }
cubecl-server = { workspace = true }
ciborium = { workspace = true }
log = { workspace = true }

[features]
cubecl-ir-dump = ["dep:cubecl-cpu", "cubecl-cpu/pliron-dump"]

tracing = [
  "dep:tracing",
  "burn/tracing",
  "cubecl/tracing",
  "umap-core/tracing",
  "cuscan-common/tracing",
]

[[bench]]
name = "standard_umap_cpu"
harness = false

[[bench]]
name = "standard_umap_cuda"
harness = false

[[example]]
name = "profile_standard_cuda"
required-features = ["tracing"]

[[example]]
name = "profile_standard_stages"
required-features = ["tracing"]

[[example]]
name = "ann_construction_worker"
