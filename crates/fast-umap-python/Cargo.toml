[package]
name = "fast-umap-python"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
name = "_fast_umap"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true }
numpy = { workspace = true }
fast-umap = { workspace = true }
fast-hdbscan = { workspace = true }

[features]
default = ["cuda", "cpu"]
cpu = ["fast-umap/cpu", "fast-hdbscan/cpu"]
cuda = ["fast-umap/cuda", "fast-hdbscan/cuda"]
tracing = ["fast-umap/tracing", "fast-hdbscan/tracing"]
