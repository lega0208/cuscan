[package]
name = "fast-umap"
description = "Configurable UMAP (Uniform Manifold Approximation and Projection) in Rust"
keywords = ["UMAP", "dimensionality", "manifold", "machine-learning", "GPU"]
categories = ["science", "mathematics", "visualization"]
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
fast-umap-core = { workspace = true }
fast-cubecl-common = { workspace = true }
burn = { workspace = true }
# Enable CubeCL with a concrete CPU or GPU runtime.
burn-cubecl = { workspace = true, optional = true }
cubecl = { workspace = true, optional = true }
cubecl-cpu = { workspace = true, optional = true }
rand = { workspace = true }
rayon = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-chrome = { workspace = true }
cubecl-environment = { workspace = true }
cubecl-server = { workspace = true }
ciborium = { workspace = true }
log = { workspace = true }

[features]
# Every backend feature enables CubeCL persistence so autotune, throughput calibration and
# GPU compilation results are cached on disk across processes. Without it, each process
# repeats CPU throughput calibration (~7 s) and recompiles every CUDA kernel.
default = ["cuda", "cpu"]
# CUDA requires an NVIDIA runtime; CPU remains independently selectable.
cuda = [
  "dep:burn-cubecl",
  "dep:cubecl",
  "fast-cubecl-common/cuda",
] # NVIDIA CUDA backend
cpu = [
  "dep:burn-cubecl",
  "dep:cubecl",
  "fast-cubecl-common/cpu",
] # CubeCL LLVM CPU runtime
cubecl-ir-dump = ["dep:cubecl-cpu", "cubecl-cpu/pliron-dump"]

tracing = [
  "dep:tracing",
  "burn/tracing",
  "cubecl?/tracing",
  "fast-umap-core/tracing",
  "fast-cubecl-common/tracing",
]

[[bench]]
name = "standard_umap_cpu"
required-features = ["cpu"]
harness = false

[[bench]]
name = "standard_umap_cuda"
required-features = ["cuda"]
harness = false

[[example]]
name = "profile_standard_cuda"
required-features = ["cuda", "tracing"]

[[example]]
name = "profile_standard_stages"
required-features = ["tracing"]

[[example]]
name = "ann_construction_worker"
required-features = ["cuda"]
