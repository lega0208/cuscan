[package]
name = "hdbscan"
description = "HDBSCAN clustering on CPU and CUDA"
version.workspace = true
publish.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
tracing = ["dep:tracing", "cuscan-common/tracing", "hdbscan-core/tracing"]

[dependencies]
cuscan-common = { workspace = true }
hdbscan-core = { workspace = true }
burn = { workspace = true }
burn-cubecl = { workspace = true }
cubecl = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rayon = { workspace = true }
hdbscan-core = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-chrome = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "profile_hdbscan_stages"
required-features = ["tracing"]

[[example]]
name = "profile_hdbscan_prediction"
required-features = ["tracing"]

[[bench]]
name = "hdbscan_cpu"
harness = false

[[bench]]
name = "hdbscan_cuda"
harness = false
