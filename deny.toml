# Derived from `cargo metadata --locked` for the current lockfile. Alternative
# SPDX branches (for example LGPL) are not approved merely because a crate
# offers them. Review changes to this policy and dependency notices separately.
[advisories]
ignore = [
    # Maintainer-approved: transitive compile-time proc-macro in Burn/CubeCL/faer.
    # This advisory concerns maintenance, not a vulnerability. Revisit when the
    # upstream numerical stack migrates away from paste; other advisories fail.
    { id = "RUSTSEC-2024-0436", reason = "Maintainer-approved exception for transitive compile-time paste; revisit on upstream migration" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

# cfg_block 0.1.1 has no Cargo license expression; its LICENSE contains the
# Apache-2.0 notice. The hash binds this clarification to that exact file.
[[licenses.clarify]]
name = "cfg_block"
version = "=0.1.1"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0xc9663a1e }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
