[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "fast-umap"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[dependency-groups]
dev = [
    "maturin",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pytest",
    "ruff",
    "ty",
    "umap-learn==0.5.12",
]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "python"
module-name = "fast_umap._fast_umap"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    "pyproject.toml",
    "Cargo.toml",
    "Cargo.lock",
    "bindings/python/Cargo.toml",
    { file = "bindings/python/src/**/*.rs" },
    { file = "src/**/*.rs" },
]

[tool.ruff]
line-length = 100
src = ["python", "comparison"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]

[tool.ty.src]
include = ["python", "comparison/metrics.py", "comparison/evaluate.py"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
