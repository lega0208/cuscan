[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cuscan"
description = "UMAP dimensionality reduction and HDBSCAN clustering on CPU and CUDA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
maintainers = [{ name = "M L" }]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://github.com/lega0208/cuscan"
Issues = "https://github.com/lega0208/cuscan/issues"

[project.optional-dependencies]
serialization = ["h5py>=3.11", "hdf5plugin>=5.0"]

[dependency-groups]
dev = [
    "fast-hdbscan==0.3.2",
    "hdbscan>=0.8.44",
    "maturin",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "pytest",
    "ruff",
    "ty",
    "umap-learn==0.5.12",
]

[tool.maturin]
manifest-path = "crates/cuscan-python/Cargo.toml"
python-source = "python"
module-name = "cuscan._cuscan"
features = ["pyo3/extension-module"]
include = [
    { path = "docs/development.md", format = "sdist" },
    { path = "migration_provenance.json", format = "sdist" },
]

[tool.uv]
cache-keys = [
    "pyproject.toml",
    "Cargo.toml",
    "Cargo.lock",
    { file = "crates/*/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[tool.ruff]
line-length = 100
src = ["python", "comparison"]
exclude = ["references"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "RUF"]

[tool.ty.src]
include = ["python", "comparison/metrics.py", "comparison/evaluate.py"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
